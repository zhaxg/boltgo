name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Download dependencies
        run: go mod tidy

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Build Linux amd64
        run: |
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o boltgo-linux-amd64 ./cmd/boltgo/

      - name: Build Windows amd64
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags="-s -w" -o boltgo-windows-amd64.exe ./cmd/boltgo/

      - name: Compress with UPX
        run: |
          sudo apt-get update && sudo apt-get install -y upx-ucl
          upx --best boltgo-linux-amd64 || true
          upx --best boltgo-windows-amd64.exe || true

      - name: Create checksums
        run: |
          sha256sum boltgo-linux-amd64 boltgo-windows-amd64.exe > checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: |
            ## Changes
            - See commit history for details
            
            ## Downloads
            | File | Platform |
            |------|----------|
            | boltgo-linux-amd64 | Linux x86_64 |
            | boltgo-windows-amd64.exe | Windows x86_64 |
            
            ## Usage
            ```bash
            # Linux
            chmod +x boltgo-linux-amd64
            ./boltgo-linux-amd64 send ./data 192.168.1.10:7879
            
            # Windows
            boltgo-windows-amd64.exe send ./data 192.168.1.10:7879
            ```
          files: |
            boltgo-linux-amd64
            boltgo-windows-amd64.exe
            checksums.txt
          draft: false
          prerelease: false
